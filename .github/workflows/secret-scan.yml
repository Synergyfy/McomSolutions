# Secret-scan gate — Phase 1A follow-up (REMEDIATION-PLAN Appendix D2).
# Blocks any PR/push that (re)introduces hardcoded secrets, including the
# MCOM SSO/HMAC/webhook/API prefixes (see gitleaks.toml).
# REQUIRED follow-up in GitHub: Settings > Branches > branch protection >
# "Require status checks to pass" > select `secret-scan`. Without that tick,
# this workflow reports but does not block merges.
# NOTE (org repos): obtain a free GITLEAKS_LICENSE at gitleaks.io and add it
# as a repo/org secret named GITLEAKS_LICENSE, or the scan step may fail.
name: secret-scan

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
